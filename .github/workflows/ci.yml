name: CI

on:
  push:
    branches:
    - main
    tags:
      - '*'
  pull_request:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CRDS_TEST_ROOT: /tmp
  CRDS_PATH: /tmp/crds-cache-default-test
  CRDS_TESTING_CACHE: /tmp/crds-cache-test
  CRDS_SERVER_URL: https://hst-crds.stsci.edu
  CRDS_CLIENT_RETRY_COUNT: 3
  CRDS_CLIENT_RETRY_DELAY_SECONDS: 20
  LD_LIBRARY_PATH: /usr/local/lib
  AWS_ENDPOINT_URL: http://localhost:5000

defaults:
  run:
    shell: bash -leo pipefail {0} {0}

jobs:
  cache:
    uses: ./.github/workflows/cache.yml
  pytest:
    name: ${{ matrix.runs-on }} Python ${{ matrix.python-version }}
    needs: [ cache ]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-latest
        python-version:
          - '3.12'
          - '3.13'
          # if this breaks, add an upper pin to `requires-python` and revert this to the latest working version
          - '3.*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39  # v3.2.1
        with:
          environment-name: crds-testing
          create-args: >-
            python=${{ matrix.python-version }}
            asdf
            astropy
            filelock
            fitsverify
            numpy
            parsley
            pillow
            requests
            scipy
            six
          init-shell: bash
          cache-environment: true
          cache-downloads: true
      - run: pip install roman-datamodels git+https://github.com/spacetelescope/jwst
      - run: pip uninstall --yes crds && ./install && pip install .[submission,test,docs,synphot]
      # dummy AWS credentials S3 testing (moto)
      - run: mkdir /tmp/.aws && touch /tmp/.aws/credentials && echo -e "[default]\naws_access_key_id = testing\naws_secret_access_key = testing" > /tmp/.aws/credentials
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ needs.cache.outputs.path }}
            ${{ needs.cache.outputs.testing_cache }}
          key: ${{ needs.cache.outputs.key }}
      - run: ./runtests --cover
